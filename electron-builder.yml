appId: com.gielinor.nexus
productName: Gielinor Nexus
copyright: Copyright © 2024 GielinorNexus

directories:
  buildResources: assets
  output: release/${version}

files:
  - out/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gielinor Nexus

publish: null
